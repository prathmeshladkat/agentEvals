[project]
name = "vobs"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Prathmesh Ladkat", email = "prathameshladkat336@gmail.com" }
]

requires-python = ">=3.12,<3.13"
dependencies = [
    # LiveKit stack (core and plugins must share one version)
    "livekit-agents==1.6.6",
    "livekit-plugins-silero==1.6.6",
    "livekit-plugins-deepgram==1.6.6",
    "livekit-plugins-elevenlabs==1.6.6",
    "livekit-plugins-groq==1.6.6",
    "livekit-plugins-openai==1.6.6",

    # OpenTelemetry (LiveKit requires 1.39.x)
    "opentelemetry-api==1.39.1",
    "opentelemetry-sdk==1.39.1",
    "opentelemetry-exporter-otlp-proto-http==1.39.1",

    # Backend (fastapi pinned to the version from your old working file)
    "fastapi==0.136.3",
    "uvicorn[standard]==0.49.0",
    "psycopg[binary,pool]==3.3.4",
    "pydantic-settings",
    "python-dotenv",
    "apscheduler==3.11.2",
    "httpx",
    "pyyaml",
]

[tool.uv]
override-dependencies = ["av==18.0.0", "jiter==0.16.0"]

[project.scripts]
vobs = "vobs:main"

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

